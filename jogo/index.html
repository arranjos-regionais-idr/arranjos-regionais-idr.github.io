  // ---------- sprites próprios do jogo, no mesmo estilo (Spr, paleta e contorno do site) ----------

  function criarSprites() {

    SPR.vaca = (() => { const p = new Spr(24, 15); [4, 8, 15, 19].forEach(x => p.rect(x, 9, 2, 5, T.wht[0])); p.sEll(11, 7, 9, 4.5, T.wht); [[7, 5], [13, 8], [16, 5]].forEach(([x, y]) => p.ell(x, y, 2.2, 1.6, T.mus[0])); p.sEll(21, 5, 3, 3, T.wht); p.rect(22, 6, 2, 2, '#f2a0a0'); p.set(21, 4, OL); p.set(19, 2, T.crm[2]); p.line(2, 6, 1, 11, T.wht[0]); return p.outline().canvas(); })();

    // plantas da lavoura em três estados: seca, cuidada e no ponto (com fruto)

  function canoaCima(sp, q) {
    const { Spr, T } = K, n = Math.max(1, Math.min(3, sp.equipe)), L = 36 + n * 10 + Math.min(2, sp.trans.length) * 4, hw = 7, w = 34, cx = 16.5;
    const p = new Spr(w, L + 8), TAB = ['#6e4a30', '#7c5638'], X = j => hw * Math.pow(Math.max(0, 1 - Math.pow(j / (L - 1) * 2 - 1, 2)), .55);

    else for (let i = 0; i < 6; i++) px(372 + i * 12, 152, 2, 8, T.wood[0]);

    // ASSOCIATIVISMO: os produtores vão ao galpão, conversam, as bandeirolas sobem, votam de mão erguida e a placa sobe
    const ko = feito('org') ? 1 : emAcao('org'), reu = feito('org') ? 1 : suave(limita(ko / .4));
    const nBand = feito('org') ? 8 : Math.floor(limita((ko - .4) / .45) * 8.99);
    if (nBand) { for (let x = 332; x < 394; x++) px(x, 60 + Math.round(Math.sin((x - 332) / 62 * Math.PI) * 4), 1, 1, T.brn[0]); for (let i = 0; i < nBand; i++) { const x = 335 + i * 7; px(x, 62 + Math.round(Math.sin((x - 332) / 62 * Math.PI) * 4), 3, 3, K.PUB_CORES[i % K.PUB_CORES.length]); } }
    const kpl = feito('org') ? 1 : limita((ko - .85) / .15);
    if (kpl) { const h = Math.round(SPR.placa.height * suave(kpl)); g.drawImage(SPR.placa, 0, 0, 30, h, 298, 98 - h, 30, h); }
    const votando = ko > .78 && ko < 1;
    [[6, 106], [16, 112], [118, 142], [130, 136]].forEach(([hx, hy], i) => {
      const tx = 326 + i * 11, ty = 94 + (i % 2) * 4, x = hx + (tx - hx) * reu, y = hy + (ty - hy) * reu;
      const q = reu > 0 && reu < 1 ? (Math.floor(t * 6) + i) % 2 + 1 : 0;
      pessoas.push({ y: y + 18, f: () => { K.sombra(g, x + 6, y + 18, 5, 1.5); g.drawImage(SPR.prod[i][q], Math.round(x), Math.round(y)); if (votando) { px(x + 1, y + 2, 1, 6, K.OL); px(x + 1, y + 1, 1, 1, '#e0a070'); px(x + 2, y + 3, 1, 5, '#e0a070'); } } });
      const fala = (ko > .4 && ko < .78 && Math.floor(t * 1.6) % 4 === i) || (feito('org') && Math.floor(t * .5) % 8 === i * 2 && Math.sin(t * 3) > -.5);
      if (fala) baloes.push([x + 6, y - 2]);
    });

    // colegas no trapiche e a extensionista que o jogador guia (trabalhando, com barra de progresso)
    [...esc.equipe].slice(1).forEach((_, i) => pessoas.push({ y: 168, f: () => g.drawImage(SPR.colegas[i % 2], 44 + i * 9, 150) }));
    const trabalhando = !!V.acao, q = trabalhando ? (Math.floor(t * 6) % 2) + 1 : V.passo ? (Math.floor(V.passo * 8) % 2) + 1 : 0;
    pessoas.push({ y: V.y, f: () => {
      K.sombra(g, V.x, V.y, 5, 1.5); g.drawImage((V.costas && !trabalhando ? SPR.extCostas : SPR.ext)[q], Math.round(V.x - 6), Math.round(V.y - 18 - (trabalhando && q === 2 ? 1 : 0)));
      if (trabalhando) {
        if (V.acao.tarefa.id !== 'drone') { const a = Math.sin(t * 14) * 1.2; px(V.x + 5 + Math.cos(a) * 3, V.y - 10 + Math.sin(a) * 3, 2, 2, T.mtl[1]); px(V.x + 5, V.y - 10, 1, 1, T.wood[1]); }
        const k = V.acao.t / DUR; px(V.x - 9, V.y - 27, 18, 4, K.OL); px(V.x - 8, V.y - 26, Math.round(16 * k), 2, '#ffe07a'); px(V.x - 8, V.y - 26, Math.round(16 * k), 1, '#ffffff');
      }
    } });
    pessoas.sort((a, b) => a.y - b.y).forEach(o => o.f());
    baloes.forEach(([x, y]) => balao(x, y));
    // setas amarelas nos pontos de trabalho (o mesmo marcador da canoa ativa no site)
    V.tarefas.forEach(tf => { if (feito(tf.id) || (V.acao && V.acao.tarefa === tf)) return; const ax = tf.x, ay = tf.y - 34 + Math.round(Math.sin(t * 4) * 2); px(ax - 4, ay - 1, 9, 2, K.OL); for (let i = 0; i < 4; i++) px(ax - 3 + i, ay + i, 7 - i * 2, 1, '#ffe07a'); });
    V.part.forEach(p => { g.globalAlpha = Math.min(1, p.v * 2); px(p.x, p.y, p.cor === '#ffffff' || p.cor === '#ffe07a' ? 1 : 2, p.cor === '#ffe07a' ? 2 : 1, p.cor); if (p.cor === '#ffe07a') px(p.x - 1, p.y + 1, 3, 1, p.cor); }); g.globalAlpha = 1;
    K.desenharAves(g, W, t);
    void dt;
  }

  // ---------- fim ----------
  function telaFim() {
    fase = 'fim';
    const fora = Object.keys(AREAS).filter(c => !esc.areas.has(c)).map(c => AREAS[c].nome), b = rio.batidas;
    const nota = b === 0 ? 'travessia perfeita, sem nenhuma batida' : b <= 3 ? b + ' batida' + (b > 1 ? 's' : '') + ', nada que a equipe não resolvesse' : b + ' batidas: deu trabalho, mas a canoa chegou';
    $('cartao').innerHTML = '<h2>Arranjo ' + esc.arr.nome + ' entregue!</h2><p>Rio acima: ' + nota + '.</p><ul class="resumo">' +
      '<li><b>Cadeia produtiva:</b> ' + esc.arr.nomeCadeia + '</li><li><b>Áreas transversais:</b> ' + [...esc.areas].map(c => AREAS[c].nome).join(', ') + '</li>' +
      '<li><b>Público:</b> ' + [...esc.publico].join(', ') + '</li><li><b>Municípios:</b> ' + [...esc.municipios].join(', ') + '</li><li><b>Equipe:</b> ' + [...esc.equipe].join(', ') + '</li></ul>' +
      '<button class="lancar" id="btnDeNovo">Jogar com outro arranjo</button>';
    $('fala').textContent = 'O vilarejo mudou de cara com o trabalho de extensão!';
    $('balcao').innerHTML = '<div class="abas"><button class="ativa">É assim no sistema de verdade</button></div><div class="paleta"><p>Cada regional do IDR-Paraná monta os seus arranjos regionais do mesmo jeito: escolhe a cadeia produtiva ou a área, o público, os municípios e a equipe. Com tudo isso, a canoa ganha o rio e o plano de trabalho chega às famílias produtoras.</p>' +
      (fora.length ? '<p class="dica">Ficaram na margem: ' + fora.join(', ') + '. Elas podem embarcar em outro arranjo.</p>' : '') + '</div>';
    $('btnDeNovo').onclick = telaTitulo;
  }

  // ---------- laço e controles ----------
  let ultimo = performance.now();
  function quadro(agora) {
    const dt = Math.min(.05, (agora - ultimo) / 1000); ultimo = agora; t += dt;
    if (fase === 'titulo') desenhaTitulo();
    else if (fase === 'margem') desenhaMargem(dt);
    else if (fase === 'rio') { atualizaRio(dt); if (fase === 'rio') desenhaRio(); }
    if (fase === 'vila' || fase === 'fim') { if (fase === 'vila') atualizaVila(dt); desenhaVila(dt); }
    requestAnimationFrame(quadro);
  }
  const JOGO = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '];
  function aperta(k) { if ((k === ' ' || k === 'Enter') && fase === 'vila') acaoVila(); }
  addEventListener('keydown', e => {
    const emBotao = document.activeElement && document.activeElement.tagName === 'BUTTON';
    if (JOGO.includes(e.key) && (fase === 'rio' || fase === 'vila')) e.preventDefault();
    if (!teclas[e.key] && !(emBotao && fase !== 'vila')) aperta(e.key);
    teclas[e.key] = true;
  });
  addEventListener('keyup', e => { teclas[e.key] = false; });
  addEventListener('blur', () => Object.keys(teclas).forEach(k => { teclas[k] = false; }));
  addEventListener('resize', () => { if (K && fase !== 'margem') telaTam(W, H); });
  document.querySelectorAll('#toque button').forEach(b => {
    const k = b.dataset.k;
    b.addEventListener('pointerdown', e => { e.preventDefault(); teclas[k] = true; aperta(k); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => { teclas[k] = false; }));
  });
  function atalhoTeste() { // só na prévia local: /jogo/?vila=0 abre o vilarejo do arranjo 0 com todas as áreas
    const m = /[?&]vila=(\d)/.exec(location.search);
    if (!m || location.hostname !== '127.0.0.1') return false;
    const arr = ARRANJOS[+m[1]] || ARRANJOS[0];
    esc = { arr, areas: new Set(Object.keys(AREAS).slice(0, CAP_AREAS + 1)), publico: new Set(arr.publico.slice(0, 2)), municipios: new Set(arr.municipios.slice(0, 1)), equipe: new Set(EQUIPE.slice(0, 3)) };
    rio = { batidas: 0 }; telaVila();
    window.__tarefa = id => { const tf = vila.tarefas.find(x => x.id === id); vila.x = tf.x; vila.y = tf.y; acaoVila(); };
    return true;
  }
  carregarArte().then(kit => { K = kit; criarSprites(); if (!atalhoTeste()) telaTitulo(); requestAnimationFrame(quadro); })
    .catch(err => { $('palco').innerHTML = '<p class="aviso">' + err.message + ' Abra o jogo pelo endereço do site.</p>'; });
})();
</script>
